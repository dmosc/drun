<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drun</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d13;
      --s1: #11141d;
      --s2: #181c28;
      --s3: #1e2234;
      --border: #222638;
      --border-hi: #333a5a;
      --text: #c6cae6;
      --text-dim: #7a82aa;
      --text-muted: #444c6e;
      --accent: #7c6af5;
      --accent-bg: #1a1740;
      --green: #4fd98a;
      --green-bg: #0b2218;
      --amber: #f0982e;
      --amber-bg: #261708;
      --red: #e0556a;
      --red-bg: #25090f;
      --mono: 'SF Mono', 'Cascadia Mono', 'Fira Code', Consolas, monospace;
      --radius: 7px;
    }

    html,
    body {
      height: 100%;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13.5px;
      line-height: 1.45;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    #page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      background: var(--s1);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }

    .live-dot.offline {
      background: var(--text-muted);
      box-shadow: none;
    }

    /* ── Status strip ──────────────────────────────────────────────────── */
    #status-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--s1);
      border-bottom: 1px solid var(--border);
    }

    .stat-warn {
      color: var(--amber);
    }

    .stat-danger {
      color: var(--red);
    }

    .daemon-row {
      display: flex;
      gap: 10px;
      padding: 4px 0;
      font-size: 11.5px;
      line-height: 1.5;
    }

    .daemon-row-label {
      flex-shrink: 0;
      width: 80px;
      color: var(--text-muted);
    }

    .daemon-row-value {
      font-family: var(--mono);
      color: var(--text-dim);
      word-break: break-word;
    }

    /* ── Modals ────────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-box {
      background: var(--s1);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      width: min(640px, 90vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }

    #status-modal-body {
      padding: 4px 14px 12px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .modal-textarea {
      flex: 1;
      min-height: 90px;
      margin: 12px 14px;
      padding: 10px;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
    }

    #config-modal-textarea {
      min-height: 320px;
    }

    .modal-input {
      max-width: 320px;
      margin: 12px 14px;
      padding: 10px;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
    }

    .modal-error {
      margin: 0 14px 10px;
      color: var(--red);
      font-size: 11.5px;
    }

    .modal-error:empty {
      display: none;
    }

    /* ── Page body ─────────────────────────────────────────────────────── */
    #page-body {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    section {
      margin-top: 16px;
    }

    section.hidden {
      display: none !important;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .mono-id {
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .label-badge {
      font-size: 11.5px;
      padding: 1px 7px;
      border-radius: 4px;
      background: var(--accent-bg);
      color: var(--accent);
    }

    /* ── Session cards ─────────────────────────────────────────────────── */
    #sessions-grid {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 12.5px;
      padding: 24px 0;
      text-align: center;
      flex: 1;
    }

    .session-card {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.12s, background 0.12s;
      display: flex;
      flex-direction: column;
      flex: 0 0 260px;
      width: 260px;
    }

    .session-card.active {
      border-color: var(--accent);
    }

    .session-card-main {
      padding: 12px;
      cursor: pointer;
      user-select: none;
      flex: 1;
    }

    .session-card-main:hover {
      background: var(--s2);
    }

    .session-card.active .session-card-main {
      background: var(--accent-bg);
    }

    .card-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 26px;
      margin-bottom: 6px;
    }

    .card-session-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-session-label.unlabeled {
      font-weight: 400;
      color: var(--text-muted);
    }

    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .card-badges-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-family: var(--mono);
      padding: 3px 6px;
      border-radius: 4px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge-neutral {
      background: var(--s3);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    @keyframes cp-blink {
      0% {
        background: var(--green-bg);
        color: var(--green);
        border-color: rgba(79, 217, 138, 0.5);
      }

      100% {
        background: var(--s3);
        color: var(--text-dim);
        border-color: var(--border);
      }
    }

    .cp-blink {
      animation: cp-blink 1s ease-out;
    }

    .badge-warn {
      background: var(--amber-bg);
      color: var(--amber);
      border: 1px solid rgba(240, 152, 46, 0.3);
    }

    .badge-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(224, 85, 106, 0.35);
    }

    .badge-live {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid rgba(79, 217, 138, 0.35);
    }

    .card-actions-row {
      display: flex;
      border-top: 1px solid var(--border);
    }

    .card-action {
      flex: 1;
      background: none;
      border: none;
      border-right: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      padding: 6px 2px;
      cursor: pointer;
      transition: color 0.12s, background 0.12s;
    }

    .card-action:last-child {
      border-right: none;
    }

    .card-action:hover {
      color: var(--text);
      background: var(--s2);
    }

    .card-action-danger:hover {
      color: var(--red);
      background: var(--red-bg);
    }

    .card-action:disabled,
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .card-action:disabled:hover {
      color: var(--text-dim);
      background: none;
    }

    .btn:disabled:hover {
      color: var(--text-dim);
      border-color: var(--border-hi);
    }

    /* ── Checkpoint info ───────────────────────────────────────────────── */
    .context-description {
      flex-basis: 100%;
      color: var(--text-muted);
      font-size: 11.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      background: none;
      border: 1px solid var(--border-hi);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 11px;
      padding: 4px 9px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
      white-space: nowrap;
    }

    .btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .btn-link {
      border: none;
      padding: 2px 4px;
    }

    /* ── Tabs panel ────────────────────────────────────────────────────── */
    .tabs-panel {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    #checkpoint-picker-btn {
      flex: 0 0 auto;
      min-width: 12ch;
      font-family: var(--mono);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .checkpoint-modal-list {
      overflow-y: auto;
      max-height: 50vh;
      margin: 12px 14px;
    }

    .checkpoint-modal-item {
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
    }

    .checkpoint-modal-item:hover {
      background: var(--s2);
    }

    .checkpoint-modal-item.current {
      background: var(--green-bg);
      color: var(--green);
    }

    .tabs-spacer {
      flex: 1;
    }

    .tabs-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .tabs-head {
      display: flex;
      overflow-x: auto;
      overscroll-behavior: contain;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-body {
      padding: 12px 14px;
    }

    .cp-info-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .cp-info-delta {
      display: flex;
      gap: 10px;
    }

    .steps-list {
      display: flex;
      flex-direction: column;
      margin-top: 12px;
      max-height: 450px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .step-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      align-items: baseline;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }

    .step-row:first-child {
      border-top: none;
      padding-top: 0;
    }

    .step-index {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .step-tool {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      white-space: nowrap;
    }

    .step-description {
      flex-basis: 100%;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: break-word;
    }

    .chat-turns-list {
      display: flex;
      flex-direction: column;
      margin-top: 12px;
      max-height: 450px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .chat-turn {
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    .chat-turn:first-child {
      border-top: none;
      padding-top: 0;
    }

    .chat-turn-role {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      margin-right: 6px;
    }

    .chat-turn-prompt,
    .chat-turn-response {
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: break-word;
    }

    .chat-turn-prompt {
      color: var(--text);
      margin-bottom: 4px;
    }

    .chat-turn-response {
      color: var(--text-dim);
    }

    /* ── Columns ───────────────────────────────────────────────────────── */
    .files-columns {
      display: grid;
      grid-template-columns: 280px minmax(260px, 1fr);
      gap: 10px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .files-columns {
        grid-template-columns: 1fr;
      }

      .modal-textarea,
      .modal-input {
        font-size: 16px;
      }
    }

    .column {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .column-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .column-head-hint {
      font-size: 10.5px;
      font-weight: 400;
      font-family: var(--mono);
      color: var(--text-muted);
    }

    .files-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .column-body {
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    #output-body {
      height: 600px;
      min-height: 100px;
      max-height: 90vh;
      padding: 10px;
      resize: vertical;
    }

    #files-tree {
      height: 600px;
      min-height: 100px;
      max-height: 90vh;
      resize: vertical;
    }

    #files-preview {
      height: 600px;
      min-height: 100px;
      max-height: 90vh;
      overflow-y: auto;
      resize: vertical;
    }

    .empty-column-note {
      padding: 12px 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Output column ─────────────────────────────────────────────────── */
    .output-label {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .output-label:not(:first-child) {
      margin-top: 12px;
    }

    .output-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .output-section-head:not(:first-child) {
      margin-top: 12px;
    }

    .output-pre {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .output-pre-scroll {
      max-height: 450px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .output-command {
      color: var(--text);
    }

    .output-command::before {
      content: '$ ';
      color: var(--accent);
      font-weight: 700;
    }

    .output-empty {
      font-size: 12px;
      color: var(--text-muted);
    }

    .loading-note {
      padding: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Files column ──────────────────────────────────────────────────── */
    .file-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 11.5px;
      cursor: default;
    }

    .file-row.tree-file:hover {
      background: var(--s2);
    }

    .file-row.tree-file.active {
      background: var(--accent-bg);
    }

    .file-row.tree-file.active .file-path {
      color: var(--accent);
    }

    .file-sigil {
      width: 10px;
      font-weight: 700;
      flex-shrink: 0;
      text-align: center;
    }

    .sigil-a {
      color: var(--green);
    }

    .sigil-m {
      color: var(--amber);
    }

    .sigil-r {
      color: var(--red);
    }

    .file-sigil.sigil-m {
      cursor: pointer;
    }

    .file-path {
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .file-size {
      color: var(--text-muted);
      font-size: 10px;
      flex-shrink: 0;
    }

    .file-row-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .file-action-btn {
      background: none;
      border: 1px solid var(--border-hi);
      border-radius: 3px;
      color: var(--text-muted);
      font-size: 10px;
      padding: 1px 6px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }

    .file-action-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .file-action-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .tree-dir {
      margin: 0;
    }

    .tree-dir-label {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-dim);
      cursor: pointer;
      list-style: none;
    }

    .tree-dir-label::-webkit-details-marker {
      display: none;
    }

    .tree-dir-label::before {
      content: '▸';
      color: var(--text-muted);
      font-size: 9px;
      width: 8px;
    }

    .tree-dir[open]>.tree-dir-label::before {
      content: '▾';
    }

    .tree-dir-body {
      padding-left: 12px;
    }

    .tree-dir-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-removed {
      border-top: 1px solid var(--border);
      margin-top: 2px;
      padding-top: 2px;
    }

    .file-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
    }

    .file-preview-body {
      padding: 10px;
    }

    .file-preview-image {
      max-width: 100%;
      border-radius: 4px;
      display: block;
    }

    .file-preview-pdf,
    .file-preview-html {
      width: 100%;
      height: 700px;
      border: none;
      border-radius: 4px;
    }

    .file-preview-media {
      width: 100%;
      display: block;
    }

    .file-preview-diff-label {
      padding: 8px 10px 0;
      font-size: 10.5px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    .diff-block {
      overflow-x: auto;
      overscroll-behavior: contain;
    }

    .diff-line {
      display: block;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.55;
      white-space: pre;
    }

    .diff-line.added {
      color: var(--green);
      background: var(--green-bg);
    }

    .diff-line.removed {
      color: var(--red);
      background: var(--red-bg);
    }

    .diff-line.meta {
      color: var(--text-muted);
    }

    .diff-line.hunk {
      color: var(--accent);
    }

    .diff-line.context {
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <header id="page-header">
    <div class="header-logo">
      <span class="logo-name">drun</span>
    </div>
    <div class="header-status">
      <span class="live-dot" id="live-dot"></span>
      <span id="status-label">Connecting…</span>
    </div>
  </header>

  <div id="status-strip">
    <button class="btn" onclick="openStatusModal()">Server status</button>
    <button class="btn" onclick="onEditConfigClick()">Edit config</button>
    <button class="btn" onclick="onReloadClick()">Reload</button>
    <button class="btn" onclick="onNewSessionClick()">New session</button>
  </div>

  <div id="status-modal-overlay" class="modal-overlay hidden" onclick="if (event.target === this) closeStatusModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span>Server status</span>
      </div>
      <div id="status-modal-body"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeStatusModal()">Close</button>
      </div>
    </div>
  </div>

  <div id="config-modal-overlay" class="modal-overlay hidden" onclick="if (event.target === this) closeConfigModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span>Edit configuration</span>
      </div>
      <textarea id="config-modal-textarea" class="modal-textarea" spellcheck="false"></textarea>
      <div id="config-modal-error" class="modal-error"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeConfigModal()">Cancel</button>
        <button class="btn" id="config-modal-save" onclick="onSaveConfigClick()">Save</button>
      </div>
    </div>
  </div>

  <div id="chat-modal-overlay" class="modal-overlay hidden" onclick="if (event.target === this) closeChatModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span id="chat-modal-title">Chat</span>
      </div>
      <textarea id="chat-modal-prompt" class="modal-textarea" placeholder="Tell the agent what to do…" spellcheck="false"></textarea>
      <div id="chat-modal-error" class="modal-error"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeChatModal()">Close</button>
        <button class="btn" onclick="onSendChatClick()">Send</button>
      </div>
    </div>
  </div>

  <div id="label-modal-overlay" class="modal-overlay hidden" onclick="if (event.target === this) closeLabelModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span>Label</span>
      </div>
      <input id="label-modal-input" class="modal-input" type="text" placeholder="Label for this session (empty to clear)">
      <div id="label-modal-error" class="modal-error"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeLabelModal()">Cancel</button>
        <button class="btn" onclick="onSaveLabelClick()">Save</button>
      </div>
    </div>
  </div>

  <div id="checkpoint-modal-overlay" class="modal-overlay hidden" onclick="if (event.target === this) closeCheckpointModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span>Select checkpoint</span>
      </div>
      <div id="checkpoint-modal-list" class="checkpoint-modal-list"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeCheckpointModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="page-body">
    <section id="sessions-section">
      <div class="section-label">Sessions</div>
      <div id="sessions-grid"></div>
    </section>

    <section id="workspace-section" class="hidden">
      <div class="tabs-panel">
        <div class="controls-row">
          <button class="btn" id="checkpoint-picker-btn" onclick="openCheckpointModal()">Checkpoint</button>
          <div class="tabs-spacer"></div>
          <div class="tabs-actions" id="tabs-actions"></div>
        </div>

        <div class="tabs-head">
          <button class="tab-btn" data-tab="steps" onclick="onTabClick('steps')">Steps</button>
          <button class="tab-btn" data-tab="output" onclick="onTabClick('output')">Output</button>
          <button class="tab-btn" data-tab="files" onclick="onTabClick('files')">Filesystem</button>
          <button class="tab-btn" data-tab="thoughts" onclick="onTabClick('thoughts')">Thoughts</button>
        </div>

        <div class="tab-body" data-tab="steps">
          <div id="checkpoint-steps-body"></div>
        </div>

        <div class="tab-body" data-tab="output">
          <div id="output-body"></div>
        </div>

        <div class="tab-body" data-tab="files">
          <div class="files-columns">
            <div class="column">
              <div class="column-head">
                <span>Files</span>
                <span class="files-head-right">
                  <span class="column-head-hint" id="files-counts"></span>
                  <button class="btn btn-link" id="files-toggle-all-btn" onclick="onToggleAllFoldersClick()">Expand
                    all</button>
                </span>
              </div>
              <div class="column-body" id="files-tree"></div>
            </div>

            <div class="column">
              <div class="column-body" id="files-preview"></div>
            </div>
          </div>
        </div>

        <div class="tab-body" data-tab="thoughts">
          <div id="chat-log-body"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // ── State ────────────────────────────────────────────────────────────────

    const viewState = {
      sessionTree: [],
      flatSessions: [],
      selectedSessionId: null,
      checkpointHistory: [],
      chatLog: [],
      selectedCpId: null,
      // 'steps' | 'output' | 'files' — which workspace tab is showing.
      activeTab: 'steps',
      selectedFilePath: null,
      // 'content' | 'diff' — which view the selected file is showing.
      filePreviewMode: 'content',
      // `${sessionId}:${cpId}` → { stdout, stderr, diff, fileNames, files }
      outputCache: new Map(),
      // cacheKey of the checkpoint whose fetch most recently failed, or null.
      failedCheckpointKey: null,
      // `${sessionId}:${cpId}:${path}` → { kind: 'text'|'image'|'binary', content?, url? }
      fileCache: new Map(),
      // Folder paths the user has manually collapsed in the files tree.
      collapsedFolders: new Set(),
      daemonStatus: null,
      statusModalOpen: false,
      // { path, mode, fileState } last rendered by renderFilesPreview, so the 2s
      // poll doesn't rebuild an unchanged iframe/audio/video and restart playback.
      lastRenderedPreview: null,
      // { cached, command } last rendered by renderOutputColumn, so the 2s poll
      // doesn't rebuild the output pane and reset its scroll position.
      lastRenderedOutput: null,
      // { cached, path, mode } last rendered by renderFilesTree, so the 2s poll
      // doesn't rebuild the tree and collapse open <details> folders.
      lastRenderedFilesTree: null,
      // whether the checkpoint picker modal is open, so the 2s poll knows
      // whether to keep its list live.
      checkpointModalOpen: false,
      // session_ids with a delete request in flight.
      deletingSessions: new Set(),
      // session_ids with a chat request in flight.
      chattingSessions: new Set(),
      // session_id → head checkpoint_id last seen, so renderSessionGrid can
      // detect a freshly created checkpoint and blink its badge.
      lastKnownHeadCp: new Map(),
    };

    // ── Helpers ──────────────────────────────────────────────────────────────

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtBytes(n) {
      if (n === 0) return '0 B';
      if (n < 1024) return `${n} B`;
      if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1048576).toFixed(1)} MB`;
    }

    function fmtDuration(secs) {
      if (secs < 60) return `${secs}s`;
      const mins = Math.floor(secs / 60);
      if (mins < 60) return `${mins}m`;
      const hours = Math.floor(mins / 60);
      const remMins = mins % 60;
      return remMins ? `${hours}h ${remMins}m` : `${hours}h`;
    }

    function flattenTree(tree) {
      const result = [];
      function walk(node) {
        result.push(node);
        for (const checkpoint of node.checkpoints)
          for (const fork of (checkpoint.forks || []))
            walk(fork);
      }
      for (const root of tree) walk(root);
      return result;
    }

    function findSession(sessionId) {
      return viewState.flatSessions.find(s => s.session_id === sessionId) || null;
    }

    function currentCpIdForSession(session) {
      const head = session.checkpoints.find(c => c.is_current);
      return head ? head.checkpoint_id : null;
    }

    function extractFileNamesFromDiff(diffText) {
      const added = [], modified = [], removed = [];
      const lines = diffText.split('\n');
      for (let i = 0; i < lines.length - 1; i++) {
        const line = lines[i];
        if (!line.startsWith('--- ')) continue;
        const nextLine = lines[i + 1];
        if (!nextLine.startsWith('+++ ')) continue;
        const fromPath = line.slice(4).replace(/^a\//, '');
        const toPath = nextLine.slice(4).replace(/^b\//, '');
        if (fromPath === '/dev/null') {
          added.push(toPath);
        } else if (toPath === '/dev/null') {
          removed.push(fromPath);
        } else {
          modified.push(fromPath);
        }
        i++;
      }
      return { added, modified, removed };
    }

    // Slices a single file's hunks out of a whole-checkpoint unified diff —
    // the server only exposes a checkpoint-wide diff, so file-scoped diffs
    // are derived client-side instead of adding a new endpoint for it.
    function extractFileDiff(diffText, path) {
      if (!diffText) return '';
      const lines = diffText.split('\n');
      for (let i = 0; i < lines.length - 1; i++) {
        if (!lines[i].startsWith('--- ')) continue;
        const nextLine = lines[i + 1];
        if (!nextLine.startsWith('+++ ')) continue;
        const fromPath = lines[i].slice(4).replace(/^a\//, '');
        const toPath = nextLine.slice(4).replace(/^b\//, '');
        if (fromPath !== path && toPath !== path) continue;
        let end = lines.length;
        for (let j = i + 2; j < lines.length; j++) {
          if (lines[j].startsWith('--- ')) { end = j; break; }
        }
        return lines.slice(i, end).join('\n').replace(/\n+$/, '');
      }
      return '';
    }

    // ── API ──────────────────────────────────────────────────────────────────
    // Every server endpoint the UI talks to is called through here — no other
    // function builds a `/api/...` URL by hand.

    // The session lock is briefly held per request, so a handful of reads
    // fired at once (e.g. the four checkpoint fetches below) can transiently
    // 503 on `try_lock` contention even though nothing is actually busy. A
    // couple of short retries absorb that without surfacing a false "empty"
    // state to the user.
    async function fetchWithRetry(url, read, attempts = 3, delayMs = 120) {
      for (let attempt = 1; ; attempt++) {
        const res = await fetch(url);
        if (res.ok) return read(res);
        if (res.status !== 503 || attempt >= attempts) {
          throw new Error(`${res.status} ${url}`);
        }
        await new Promise(r => setTimeout(r, delayMs));
      }
    }

    function fetchJson(url) {
      return fetchWithRetry(url, res => res.json());
    }

    function fetchText(url) {
      return fetchWithRetry(url, res => res.text());
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: body === undefined ? undefined : { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      return res.json();
    }

    const Api = {
      status: () => fetchJson('/api/status'),
      sessionsTree: () => fetchJson('/api/sessions/tree'),
      checkpointHistory: sessionId => fetchJson(`/api/sessions/${sessionId}/history`),
      chatLog: sessionId => fetchJson(`/api/sessions/${sessionId}/chat`),
      checkpointFiles: (sessionId, cpId) => fetchJson(`/api/sessions/${sessionId}/checkpoints/${cpId}/files`),
      stdout: (sessionId, cpId) => fetchText(`/api/sessions/${sessionId}/checkpoints/${cpId}/stdout`),
      stderr: (sessionId, cpId) => fetchText(`/api/sessions/${sessionId}/checkpoints/${cpId}/stderr`),
      diff: (sessionId, fromId, toId) => fetchText(`/api/sessions/${sessionId}/diff?from=${fromId}&to=${toId}`),
      fork: (sessionId, checkpointId) => postJson(`/api/sessions/${sessionId}/fork`, { checkpoint_id: checkpointId }),
      rollback: (sessionId, checkpointId) => postJson(`/api/sessions/${sessionId}/rollback`, { checkpoint_id: checkpointId }),
      setLabel: (sessionId, label) => postJson(`/api/sessions/${sessionId}/label`, { label }),
      snapshot: sessionId => postJson(`/api/sessions/${sessionId}/snapshot`, undefined),
      createSession: () => postJson('/api/sessions', undefined),

      async fileContent(sessionId, cpId, path) {
        const url = `/api/sessions/${sessionId}/checkpoints/${cpId}/files/${path.split('/').map(encodeURIComponent).join('/')}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${res.status} ${url}`);
        const contentType = res.headers.get('content-type') || '';
        if (contentType.startsWith('image/')) return { kind: 'image', url };
        if (contentType === 'application/pdf') return { kind: 'pdf', url };
        if (contentType.startsWith('text/html')) return { kind: 'html', url };
        if (contentType.startsWith('audio/')) return { kind: 'audio', url };
        if (contentType.startsWith('video/')) return { kind: 'video', url };
        if (res.headers.get('x-drun-binary') === 'true') return { kind: 'binary' };
        return { kind: 'text', content: await res.text() };
      },

      async deleteSession(sessionId) {
        const res = await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
        if (!res.ok && res.status !== 404) throw new Error(`${res.status} deleting ${sessionId}`);
      },

      getConfig: () => fetchText('/api/config'),

      async saveConfig(contents) {
        const res = await fetch('/api/config', { method: 'PUT', body: contents });
        if (!res.ok) throw new Error(await res.text());
      },

      chat: (sessionId, prompt) => postJson(`/api/sessions/${sessionId}/chat`, { prompt }),
    };

    // ── Config modal ─────────────────────────────────────────────────────────

    async function onEditConfigClick() {
      const textarea = document.getElementById('config-modal-textarea');
      const error = document.getElementById('config-modal-error');
      error.textContent = '';
      textarea.value = 'Loading…';
      document.getElementById('config-modal-overlay').classList.remove('hidden');
      try {
        textarea.value = await Api.getConfig();
      } catch (e) {
        error.textContent = `Failed to load config: ${e.message}`;
      }
    }

    function closeConfigModal() {
      document.getElementById('config-modal-overlay').classList.add('hidden');
    }

    function onReloadClick() {
      location.reload();
    }

    async function onNewSessionClick() {
      let created;
      try {
        created = await Api.createSession();
      } catch (e) {
        console.error('Failed to create session:', e);
        alert(`Failed to create session: ${e.message}`);
        return;
      }
      await refresh();
      await onSessionClick(created.session_id);
    }

    async function onSaveConfigClick() {
      const textarea = document.getElementById('config-modal-textarea');
      const error = document.getElementById('config-modal-error');
      const btn = document.getElementById('config-modal-save');
      error.textContent = '';
      btn.disabled = true;
      try {
        await Api.saveConfig(textarea.value);
        closeConfigModal();
      } catch (e) {
        error.textContent = e.message;
      } finally {
        btn.disabled = false;
      }
    }

    // ── Chat modal ───────────────────────────────────────────────────────────

    let chatModalSessionId = null;

    function onChatClick(sessionId) {
      chatModalSessionId = sessionId;
      document.getElementById('chat-modal-title').textContent = `Chat ${sessionId}`;
      document.getElementById('chat-modal-prompt').value = '';
      document.getElementById('chat-modal-error').textContent = '';
      document.getElementById('chat-modal-overlay').classList.remove('hidden');
    }

    function closeChatModal() {
      chatModalSessionId = null;
      document.getElementById('chat-modal-overlay').classList.add('hidden');
    }

    async function onSendChatClick() {
      const sessionId = chatModalSessionId;
      const prompt = document.getElementById('chat-modal-prompt').value.trim();
      if (!sessionId || !prompt) return;

      closeChatModal();
      viewState.chattingSessions.add(sessionId);
      renderSessionGrid();
      try {
        await Api.chat(sessionId, prompt);
      } catch (e) {
        alert(`Chat request failed: ${e.message}`);
      } finally {
        viewState.chattingSessions.delete(sessionId);
        renderSessionGrid();
      }
    }

    // ── Clipboard ────────────────────────────────────────────────────────────

    async function copyToClipboard(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
      flashButton(btn);
    }

    function copySectionOutput(btn) {
      const pre = btn.closest('.output-section-head').nextElementSibling;
      copyToClipboard(pre.textContent, btn);
    }

    function flashButton(btn) {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = original; }, 1000);
    }

    // ── Rendering: daemon status ─────────────────────────────────────────────

    function renderStatusModal() {
      if (!viewState.statusModalOpen) return;
      const body = document.getElementById('status-modal-body');
      const status = viewState.daemonStatus;
      if (!status) { body.innerHTML = '<div class="loading-note">Loading…</div>'; return; }

      const capacity = status.max_sessions
        ? `${status.session_count}/${status.max_sessions} sessions`
        : `${status.session_count} sessions`;
      const capacityClass = status.max_sessions && status.session_count / status.max_sessions >= 0.9
        ? 'stat-danger' : status.max_sessions && status.session_count / status.max_sessions >= 0.7
          ? 'stat-warn' : '';

      const idleTimeout = status.session_idle_timeout_secs != null
        ? `${fmtDuration(status.session_idle_timeout_secs)} idle timeout` : 'No idle timeout';
      const workspace = status.max_workspace_mb != null
        ? `${status.max_workspace_mb} MB workspace cap` : 'No workspace cap';
      const checkpoints = status.max_checkpoints != null
        ? `${status.max_checkpoints} checkpoints per session` : 'No checkpoint cap';

      const rows = [
        ['Version', `v${escHtml(status.version)}`],
        ['PID', status.pid],
        ['Uptime', fmtDuration(status.uptime_secs)],
        ['Sessions', `<span class="${capacityClass}">${capacity}</span>`],
        ...(status.memory_rss_bytes != null ? [['Memory', fmtBytes(status.memory_rss_bytes)]] : []),
        ['Ports', `MCP :${status.mcp_port}  Web :${status.web_port}`],
        ['Limits', `${idleTimeout} ${workspace} ${checkpoints}`],
        ['Domains', status.domain_allowlist.length ? escHtml(status.domain_allowlist.join(', ')) : 'None allowed'],
        ['Mounts', status.mount_allowlist.length ? escHtml(status.mount_allowlist.join(', ')) : 'All host paths allowed'],
      ];

      body.innerHTML = rows.map(([label, value]) => `
        <div class="daemon-row">
          <span class="daemon-row-label">${label}</span>
          <span class="daemon-row-value">${value}</span>
        </div>`).join('');
    }

    function openStatusModal() {
      viewState.statusModalOpen = true;
      document.getElementById('status-modal-overlay').classList.remove('hidden');
      renderStatusModal();
    }

    function closeStatusModal() {
      viewState.statusModalOpen = false;
      document.getElementById('status-modal-overlay').classList.add('hidden');
    }

    document.getElementById('files-tree').addEventListener('toggle', e => {
      const details = e.target;
      const path = details?.dataset?.folderPath;
      if (path === undefined) return;
      if (details.open) viewState.collapsedFolders.delete(path);
      else viewState.collapsedFolders.add(path);
    }, true);

    // ── Rendering: sessions ──────────────────────────────────────────────────

    function sessionIdleBadge(session) {
      const idleTimeout = viewState.daemonStatus?.session_idle_timeout_secs;
      const idleAgo = `Idle: ${fmtDuration(session.idle_secs)}`;
      if (idleTimeout == null) {
        return `<span class="badge badge-neutral">${idleAgo}</span>`;
      }
      const frac = session.idle_secs / idleTimeout;
      if (frac < 0.5) {
        return `<span class="badge badge-neutral">${idleAgo}</span>`;
      }
      const remaining = Math.max(idleTimeout - session.idle_secs, 0);
      const cls = frac >= 0.9 ? 'badge-danger' : 'badge-warn';
      const text = frac >= 1 ? `${idleAgo} reaping soon` : `${idleAgo} reaps in ${fmtDuration(remaining)}`;
      return `<span class="badge ${cls}">${text}</span>`;
    }

    // Single source of truth for the session card's status pill. Priority
    // order matters: a session mid-delete is about to disappear regardless
    // of whatever else it's doing, so that takes precedence over "running".
    function sessionStatusBadge(session) {
      if (viewState.deletingSessions.has(session.session_id)) {
        return '<span class="badge badge-danger">Deleting…</span>';
      }
      if (session.running || viewState.chattingSessions.has(session.session_id)) {
        return '<span class="badge badge-live">Running</span>';
      }
      return sessionIdleBadge(session);
    }

    // Anchors the horizontally-scrolling sessions row to the start of the
    // active card, so switching sessions never leaves the selected one
    // scrolled out of view or half-cut-off at the viewport edge.
    function scrollSelectedCardIntoView() {
      const active = document.querySelector('.session-card.active');
      if (active) active.scrollIntoView({ inline: 'start', block: 'nearest', behavior: 'smooth' });
    }

    function renderSessionGrid() {
      const grid = document.getElementById('sessions-grid');
      // Newest first (smallest age) so a freshly created session is inserted
      // at the front of the horizontal scroll rather than off to the right.
      const sessions = [...viewState.flatSessions].sort((a, b) => a.age_secs - b.age_secs);

      if (sessions.length === 0) {
        grid.innerHTML = '<div class="empty-state">No active sessions — start an agent to see trajectory data here.</div>';
        return;
      }

      grid.innerHTML = sessions.map(s => {
        const isActive = s.session_id === viewState.selectedSessionId;
        const headCpId = currentCpIdForSession(s);
        const isForked = !!s.parent_session_id;

        const prevHeadCpId = viewState.lastKnownHeadCp.get(s.session_id);
        const justCreated = prevHeadCpId != null && headCpId != null && headCpId > prevHeadCpId;
        viewState.lastKnownHeadCp.set(s.session_id, headCpId);
        // Generate a disabled attribute for buttons whose operations can't
        // execute when a session is in running state due to the mutex lock
        // that gets enforced. Any operation that mutates a session gets
        // temporarily disabled during this period.
        const isBusy = s.running || viewState.chattingSessions.has(s.session_id);
        const busyAttr = isBusy ? 'disabled' : '';

        return `
          <div class="session-card ${isActive ? 'active' : ''}">
            <div class="session-card-main" onclick="onSessionClick('${escHtml(s.session_id)}')" title="Created ${fmtDuration(s.age_secs)} ago">
              <div class="card-label-row">
                <div class="card-session-label ${s.label ? '' : 'unlabeled'}">${s.label ? escHtml(s.label) : 'Unlabeled'}</div>
                ${isForked ? `<button class="btn" onclick="event.stopPropagation(); onSessionClick('${escHtml(s.parent_session_id)}')" title="Forked at checkpoint ${s.parent_checkpoint_id} — click to open">${escHtml(s.parent_session_id)}</button>` : ''}
              </div>
              <div class="card-badges">
                <div class="card-badges-row">
                  <span class="badge badge-neutral">ID: ${escHtml(s.session_id)}</span>
                  <span class="badge badge-neutral ${justCreated ? 'cp-blink' : ''}">Checkpoints: ${headCpId ?? '—'}</span>
                </div>
                ${sessionStatusBadge(s)}
              </div>
            </div>
            <div class="card-actions-row">
              <button class="card-action" onclick="copyToClipboard('${escHtml(s.session_id)}', this)">Copy</button>
              <button class="card-action" ${busyAttr} onclick="onEditLabelClick('${escHtml(s.session_id)}')">Label</button>
              <button class="card-action" ${busyAttr} onclick="onSnapshotClick('${escHtml(s.session_id)}', this)">Snapshot</button>
              <button class="card-action" ${busyAttr} onclick="onChatClick('${escHtml(s.session_id)}')">Chat</button>
              <button class="card-action card-action-danger" onclick="onDestroySessionClick('${escHtml(s.session_id)}')">Delete</button>
            </div>
          </div>`;
      }).join('');
    }

    // ── Rendering: checkpoint picker ────────────────────────────────────────────

    function renderCheckpointButton() {
      const cpId = viewState.selectedCpId;
      let text = 'Checkpoint';
      if (cpId != null) {
        const session = findSession(viewState.selectedSessionId);
        const total = session?.checkpoints.length - 1;
        text = `Checkpoint ${cpId} / ${total}`;
      }
      document.getElementById('checkpoint-picker-btn').textContent = text;
    }

    function renderCheckpointModalList() {
      if (!viewState.checkpointModalOpen) return;
      const session = findSession(viewState.selectedSessionId);
      if (!session) return;

      const list = document.getElementById('checkpoint-modal-list');
      list.innerHTML = [...session.checkpoints].reverse().map(checkpoint => {
        const label = checkpoint.label ? ` ${escHtml(checkpoint.label)}` : '';
        const current = checkpoint.is_current ? ' current' : '';
        return `<div class="checkpoint-modal-item${current}" onclick="onCheckpointModalItemClick(${checkpoint.checkpoint_id})">Checkpoint ${checkpoint.checkpoint_id}${label}</div>`;
      }).join('');
    }

    function openCheckpointModal() {
      viewState.checkpointModalOpen = true;
      renderCheckpointModalList();
      document.getElementById('checkpoint-modal-overlay').classList.remove('hidden');
    }

    function closeCheckpointModal() {
      viewState.checkpointModalOpen = false;
      document.getElementById('checkpoint-modal-overlay').classList.add('hidden');
    }

    function onCheckpointModalItemClick(cpId) {
      closeCheckpointModal();
      onCheckpointClick(cpId);
    }

    // ── Rendering: checkpoint steps tab ─────────────────────────────────────────

    function renderCheckpointSteps() {
      const cpId = viewState.selectedCpId;
      const sessionId = viewState.selectedSessionId;
      const body = document.getElementById('checkpoint-steps-body');
      if (cpId == null || !sessionId) { body.innerHTML = ''; return; }

      const hist = viewState.checkpointHistory.find(h => h.checkpoint_id === cpId);
      const steps = hist?.steps || [];

      body.innerHTML = steps.length
        ? `<div class="steps-list">${steps.map((s, i) => `
            <div class="step-row">
              <span class="step-index">${i + 1}</span>
              <span class="step-tool">${escHtml(s.tool)}</span>
              <span class="step-description">${escHtml(s.description)}</span>
            </div>`).reverse().join('')}</div>`
        : '<div class="context-description">No steps recorded on this checkpoint yet</div>';
    }

    // ── Rendering: chat log tab ──────────────────────────────────────────────

    function renderChatLog() {
      const body = document.getElementById('chat-log-body');
      const turns = viewState.chatLog;

      body.innerHTML = turns.length
        ? `<div class="chat-turns-list">${turns.map(t => `
            <div class="chat-turn">
              <div class="chat-turn-prompt"><span class="chat-turn-role">You</span>${escHtml(t.prompt)}</div>
              <div class="chat-turn-response"><span class="chat-turn-role">Agent</span>${escHtml(t.response)}</div>
            </div>`).reverse().join('')}</div>`
        : '<div class="context-description">No chat turns recorded on this session yet</div>';
    }

    // Fork/rollback actions, rendered into the tabs-head bar (right of the tabs).
    function renderCheckpointActions() {
      const cpId = viewState.selectedCpId;
      const sessionId = viewState.selectedSessionId;
      const container = document.getElementById('tabs-actions');
      if (cpId == null || !sessionId) { container.innerHTML = ''; return; }

      const session = findSession(sessionId);
      const treeCp = session?.checkpoints.find(c => c.checkpoint_id === cpId);
      const rollbackHidden = treeCp?.is_current ? 'style="display:none"' : '';

      // Fork/Rollback need the session mutex, which a running command holds
      // for its whole duration — disable rather than let the request 503.
      const isBusy = session?.running || viewState.chattingSessions.has(sessionId);
      const busyAttr = isBusy ? 'disabled' : '';

      container.innerHTML = `
        <button class="btn" ${busyAttr} onclick="onForkFromHereClick()">Fork</button>
        <button class="btn" id="rollback-here-btn" ${busyAttr} ${rollbackHidden} onclick="onRollbackHereClick()">Rollback</button>`;
    }

    // ── Rendering: tabs ──────────────────────────────────────────────────────

    function onTabClick(tab) {
      viewState.activeTab = tab;
      applyActiveTab();
    }

    function applyActiveTab() {
      for (const btn of document.querySelectorAll('.tab-btn')) {
        btn.classList.toggle('active', btn.dataset.tab === viewState.activeTab);
      }
      for (const panel of document.querySelectorAll('.tab-body')) {
        panel.hidden = panel.dataset.tab !== viewState.activeTab;
      }
    }

    // ── Rendering: output column ──────────────────────────────────────────────

    function renderOutputColumn(cached, hist) {
      const body = document.getElementById('output-body');
      if (!cached) {
        viewState.lastRenderedOutput = null;
        body.innerHTML = '<div class="loading-note">Loading…</div>';
        return;
      }

      // Skip the rewrite when nothing changed since the last render.
      const command = hist?.command ?? null;
      const last = viewState.lastRenderedOutput;
      if (last && last.cached === cached && last.command === command) return;
      viewState.lastRenderedOutput = { cached, command };

      const commandHtml = command ? `
        <div class="output-section-head">
          <span class="output-label" style="margin:0">Command</span>
          <button class="btn btn-link" onclick="copySectionOutput(this)">Copy command</button>
        </div>
        <pre class="output-pre output-command output-pre-scroll">${escHtml(command)}</pre>` : '';

      const stdoutHtml = cached.stdout
        ? `<div class="output-section-head">
            <span class="output-label" style="margin:0">Stdout</span>
            <button class="btn btn-link" onclick="copySectionOutput(this)">Copy stdout</button>
          </div>
          <pre class="output-pre output-pre-scroll">${escHtml(cached.stdout)}</pre>`
        : `<div class="output-label">Stdout</div><span class="output-empty">No output</span>`;

      const stderrHtml = cached.stderr
        ? `<div class="output-section-head">
            <span class="output-label" style="margin:0;color:var(--red)">Stderr</span>
            <button class="btn btn-link" onclick="copySectionOutput(this)">Copy stderr</button>
          </div>
          <pre class="output-pre output-pre-scroll">${escHtml(cached.stderr)}</pre>`
        : '';

      body.innerHTML = `${commandHtml}${stdoutHtml}${stderrHtml}`;
    }

    // ── Rendering: files column ───────────────────────────────────────────────

    function buildFileTree(files) {
      const root = { name: '', children: new Map(), file: null };
      for (const file of files) {
        const parts = file.path.split('/');
        let node = root;
        for (const part of parts.slice(0, -1)) {
          if (!node.children.has(part)) node.children.set(part, { name: part, children: new Map(), file: null });
          node = node.children.get(part);
        }
        const leafName = parts[parts.length - 1];
        node.children.set(leafName, { name: leafName, children: new Map(), file });
      }
      return root;
    }

    // Used to render the persisted open/closed state and to bulk-toggle
    // everything from the "Expand all"/"Collapse all" header button.
    function collectFolderPaths(children, parentPath, out) {
      for (const node of children.values()) {
        if (node.file !== null) continue;
        const folderPath = parentPath ? `${parentPath}/${node.name}` : node.name;
        out.push(folderPath);
        collectFolderPaths(node.children, folderPath, out);
      }
    }

    function renderFileTreeChildren(children, deltaByPath, parentPath) {
      const entries = [...children.values()].sort((a, b) => {
        const aIsDir = a.file === null, bIsDir = b.file === null;
        return aIsDir !== bIsDir ? (aIsDir ? -1 : 1) : a.name.localeCompare(b.name);
      });
      return entries.map(node => {
        if (node.file === null) {
          const folderPath = parentPath ? `${parentPath}/${node.name}` : node.name;
          const escFolderPath = escHtml(folderPath);
          const isOpen = !viewState.collapsedFolders.has(folderPath);
          return `
            <details class="tree-dir" data-folder-path="${escFolderPath}" ${isOpen ? 'open' : ''}>
              <summary class="tree-dir-label">
                <span class="tree-dir-name">${escHtml(node.name)}</span>
                <button class="file-action-btn" onclick="event.preventDefault(); event.stopPropagation(); copyToClipboard('${escFolderPath}', this)" title="Copy path">Copy</button>
              </summary>
              <div class="tree-dir-body">${renderFileTreeChildren(node.children, deltaByPath, folderPath)}</div>
            </details>`;
        }
        const path = node.file.path;
        const delta = deltaByPath.get(path);
        const isModified = delta === 'modified';
        const escPath = escHtml(path);
        const sigil = delta === 'added' ? '<span class="file-sigil sigil-a">+</span>'
          : isModified ? `<span class="file-sigil sigil-m" onclick="onFileClick('${escPath}', 'diff')" title="Show diff from previous checkpoint">~</span>`
            : '<span class="file-sigil"></span>';
        const isActive = path === viewState.selectedFilePath;
        const viewActive = isActive && viewState.filePreviewMode === 'content';
        const diffActive = isActive && viewState.filePreviewMode === 'diff';
        const diffBtn = isModified
          ? `<button class="file-action-btn ${diffActive ? 'active' : ''}" onclick="onFileClick('${escPath}', 'diff')">diff</button>`
          : '';
        return `
          <div class="file-row tree-file ${isActive ? 'active' : ''}" title="${escPath}">
            ${sigil}<span class="file-path">${escHtml(node.name)}</span><span class="file-size">${fmtBytes(node.file.size_bytes)}</span>
            <span class="file-row-actions">
              <button class="file-action-btn" onclick="copyToClipboard('${escPath}', this)" title="Copy path">Copy</button>
              <button class="file-action-btn ${viewActive ? 'active' : ''}" onclick="onFileClick('${escPath}', 'content')">view</button>
              ${diffBtn}
            </span>
          </div>`;
      }).join('');
    }

    function renderFilesTree(cached, hist) {
      const tree = document.getElementById('files-tree');
      const counts = document.getElementById('files-counts');
      const toggleAllBtn = document.getElementById('files-toggle-all-btn');
      counts.textContent = hist ? `${hist.file_count} total` : '';

      if (!cached?.files) {
        viewState.lastRenderedFilesTree = null;
        tree.innerHTML = '<div class="loading-note">Loading…</div>';
        toggleAllBtn.style.display = 'none';
        return;
      }

      // Skip the rewrite when nothing changed since the last render; otherwise
      // every 2s poll tick recreates every <details> element and collapses
      // any folder the user closed.
      const last = viewState.lastRenderedFilesTree;
      const unchanged = last
        && last.cached === cached
        && last.path === viewState.selectedFilePath
        && last.mode === viewState.filePreviewMode;
      if (unchanged) return;
      viewState.lastRenderedFilesTree = { cached, path: viewState.selectedFilePath, mode: viewState.filePreviewMode };

      const deltaByPath = new Map();
      for (const f of cached.fileNames?.added || []) deltaByPath.set(f, 'added');
      for (const f of cached.fileNames?.modified || []) deltaByPath.set(f, 'modified');
      const removed = cached.fileNames?.removed || [];

      if (cached.files.length === 0 && removed.length === 0) {
        tree.innerHTML = '<div class="empty-column-note">Workspace is empty</div>';
        toggleAllBtn.style.display = 'none';
        return;
      }

      const built = buildFileTree(cached.files);

      const folderPaths = [];
      collectFolderPaths(built.children, '', folderPaths);
      if (folderPaths.length === 0) {
        toggleAllBtn.style.display = 'none';
      } else {
        toggleAllBtn.style.display = '';
        const allCollapsed = folderPaths.every(p => viewState.collapsedFolders.has(p));
        toggleAllBtn.textContent = allCollapsed ? 'Expand all' : 'Collapse all';
      }

      const treeHtml = renderFileTreeChildren(built.children, deltaByPath, '');
      const removedHtml = removed.length
        ? `<div class="tree-removed">${removed.map(f => `
            <div class="file-row"><span class="file-sigil sigil-r">-</span><span class="file-path">${escHtml(f)}</span></div>`).join('')}</div>`
        : '';
      tree.innerHTML = treeHtml + removedHtml;
    }

    // Bulk-toggles every folder in the current file tree.
    function onToggleAllFoldersClick() {
      const sessionId = viewState.selectedSessionId;
      const cpId = viewState.selectedCpId;
      if (sessionId == null || cpId == null) return;
      const cached = viewState.outputCache.get(`${sessionId}:${cpId}`);
      if (!cached?.files) return;

      const folderPaths = [];
      collectFolderPaths(buildFileTree(cached.files).children, '', folderPaths);
      if (folderPaths.length === 0) return;

      const allCollapsed = folderPaths.every(p => viewState.collapsedFolders.has(p));
      for (const path of folderPaths) {
        if (allCollapsed) viewState.collapsedFolders.delete(path);
        else viewState.collapsedFolders.add(path);
      }

      viewState.lastRenderedFilesTree = null;
      renderFilesTree(cached, viewState.checkpointHistory.find(h => h.checkpoint_id === cpId));
    }

    // Renders a diff block, or an empty-state message if there's nothing to
    // show yet (still loading) or nothing changed. Shared by the no-file-selected
    // default (whole checkpoint) and the per-file diff under a file's preview.
    function diffBlockHtml(diffText, emptyMessage) {
      if (diffText === undefined) return '<div class="loading-note">Loading…</div>';
      if (!diffText) return `<div class="file-preview-body"><span class="output-empty">${escHtml(emptyMessage)}</span></div>`;
      const lines = diffText.split('\n').map(line => {
        if (line.startsWith('+++ ') || line.startsWith('--- ')) return `<span class="diff-line meta">${escHtml(line)}</span>`;
        else if (line.startsWith('+')) return `<span class="diff-line added">${escHtml(line)}</span>`;
        else if (line.startsWith('-')) return `<span class="diff-line removed">${escHtml(line)}</span>`;
        else if (line.startsWith('@@')) return `<span class="diff-line hunk">${escHtml(line)}</span>`;
        else return `<span class="diff-line context">${escHtml(line)}</span>`;
      });
      return `<div class="file-preview-body"><div class="diff-block">${lines.join('')}</div></div>`;
    }

    function renderFilesPreview(cached, fileState) {
      const preview = document.getElementById('files-preview');

      if (!viewState.selectedFilePath) {
        viewState.lastRenderedPreview = null;
        preview.innerHTML =
          `<div class="file-preview-head"><span class="mono-id">Diff from previous checkpoint</span></div>`
          + diffBlockHtml(cached?.diff, 'No changes from the previous checkpoint');
        return;
      }

      const head = `
        <div class="file-preview-head">
          <span class="mono-id">${escHtml(viewState.selectedFilePath)}</span>
        </div>`;

      let bodyHtml;
      if (viewState.filePreviewMode === 'diff') {
        const fileDiff = cached?.diff === undefined ? undefined : extractFileDiff(cached.diff, viewState.selectedFilePath);
        bodyHtml =
          `<div class="file-preview-diff-label">Diff from previous checkpoint</div>`
          + diffBlockHtml(fileDiff, 'No changes from the previous checkpoint');
      } else if (fileState === undefined) {
        bodyHtml = '<div class="loading-note">Loading…</div>';
      } else if (fileState.kind === 'image') {
        bodyHtml = `<div class="file-preview-body"><img class="file-preview-image" src="${fileState.url}" alt="${escHtml(viewState.selectedFilePath)}"></div>`;
      } else if (fileState.kind === 'pdf') {
        bodyHtml = `<div class="file-preview-body"><iframe class="file-preview-pdf" src="${fileState.url}" title="${escHtml(viewState.selectedFilePath)}"></iframe></div>`;
      } else if (fileState.kind === 'html') {
        bodyHtml = `<div class="file-preview-body"><iframe class="file-preview-html" src="${fileState.url}" title="${escHtml(viewState.selectedFilePath)}" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div>`;
      } else if (fileState.kind === 'audio') {
        bodyHtml = `<div class="file-preview-body"><audio class="file-preview-media" controls src="${fileState.url}"></audio></div>`;
      } else if (fileState.kind === 'video') {
        bodyHtml = `<div class="file-preview-body"><video class="file-preview-media" controls src="${fileState.url}"></video></div>`;
      } else if (fileState.kind === 'binary') {
        bodyHtml = `<div class="file-preview-body"><span class="output-empty">Binary file — cannot preview</span></div>`;
      } else {
        bodyHtml = `<div class="file-preview-body"><pre class="output-pre">${escHtml(fileState.content)}</pre></div>`;
      }

      // Skip the rewrite when nothing changed since the last render; otherwise
      // every 2s poll tick recreates the iframe/audio/video element which
      // causes an undesirable flicker effect.
      const last = viewState.lastRenderedPreview;
      const unchanged = last
        && last.path === viewState.selectedFilePath
        && last.mode === viewState.filePreviewMode
        && last.fileState === fileState;
      if (unchanged) return;
      viewState.lastRenderedPreview = { path: viewState.selectedFilePath, mode: viewState.filePreviewMode, fileState };

      preview.innerHTML = head + bodyHtml;
    }

    // ── Rendering: full workspace panel ───────────────────────────────────────

    function renderWorkspacePanel() {
      const cpId = viewState.selectedCpId;
      const sessionId = viewState.selectedSessionId;
      const section = document.getElementById('workspace-section');
      if (cpId == null || !sessionId) { section.classList.add('hidden'); return; }

      section.classList.remove('hidden');

      const cacheKey = `${sessionId}:${cpId}`;
      const cached = viewState.outputCache.get(cacheKey);
      const hist = viewState.checkpointHistory.find(h => h.checkpoint_id === cpId);

      renderCheckpointSteps();
      renderCheckpointActions();
      renderChatLog();
      applyActiveTab();

      if (viewState.failedCheckpointKey === cacheKey) {
        const errorHtml = `
          <div class="empty-column-note">
            Failed to load checkpoint data.
            <button class="btn" onclick="onRetryCheckpointLoad()">Retry</button>
          </div>`;
        document.getElementById('output-body').innerHTML = errorHtml;
        document.getElementById('files-tree').innerHTML = errorHtml;
        document.getElementById('files-preview').innerHTML = '';
        return;
      }

      renderOutputColumn(cached, hist);
      renderFilesTree(cached, hist);
      renderFilesPreview(cached, viewState.selectedFilePath
        ? viewState.fileCache.get(`${sessionId}:${cpId}:${viewState.selectedFilePath}`)
        : undefined);
    }

    // ── Event handlers ───────────────────────────────────────────────────────

    async function onSessionClick(sessionId) {
      if (viewState.selectedSessionId === sessionId) return;
      viewState.selectedSessionId = sessionId;
      viewState.selectedCpId = null;
      viewState.selectedFilePath = null;
      viewState.filePreviewMode = 'content';
      viewState.checkpointHistory = [];
      viewState.chatLog = [];

      renderSessionGrid();
      scrollSelectedCardIntoView();
      document.getElementById('workspace-section').classList.add('hidden');

      try {
        const [history, chatLog] = await Promise.all([
          Api.checkpointHistory(sessionId),
          Api.chatLog(sessionId),
        ]);
        viewState.checkpointHistory = history;
        viewState.chatLog = chatLog;
      } catch (e) {
        console.error('Failed to load history:', e);
      }

      // Select the current (head) checkpoint by default so the panel isn't empty.
      const session = findSession(sessionId);
      const headCpId = session ? currentCpIdForSession(session) : null;
      if (headCpId != null) {
        await onCheckpointClick(headCpId);
      }
    }

    async function onCheckpointClick(cpId) {
      if (viewState.selectedCpId === cpId) return;
      viewState.selectedCpId = cpId;
      viewState.selectedFilePath = null;
      viewState.filePreviewMode = 'content';

      renderCheckpointButton();
      renderWorkspacePanel();

      const sessionId = viewState.selectedSessionId;
      const cacheKey = `${sessionId}:${cpId}`;
      if (viewState.outputCache.has(cacheKey)) return;
      await loadCheckpointData(sessionId, cpId);
    }

    // Split out of onCheckpointClick so the retry button below can re-run it
    // without tripping the "already selected" guard that skips re-fetching.
    async function loadCheckpointData(sessionId, cpId) {
      const cacheKey = `${sessionId}:${cpId}`;
      viewState.failedCheckpointKey = null;

      try {
        const [stdout, stderr, diff, files] = await Promise.all([
          Api.stdout(sessionId, cpId),
          Api.stderr(sessionId, cpId),
          cpId > 0 ? Api.diff(sessionId, cpId - 1, cpId) : Promise.resolve(''),
          Api.checkpointFiles(sessionId, cpId),
        ]);

        const fileNames = extractFileNamesFromDiff(diff);
        viewState.outputCache.set(cacheKey, { stdout, stderr, diff, fileNames, files });
      } catch (e) {
        console.error('Failed to load checkpoint output:', e);
        viewState.outputCache.delete(cacheKey);
        viewState.failedCheckpointKey = cacheKey;
      }

      if (`${viewState.selectedSessionId}:${viewState.selectedCpId}` === cacheKey) renderWorkspacePanel();
    }

    function onRetryCheckpointLoad() {
      const sessionId = viewState.selectedSessionId;
      const cpId = viewState.selectedCpId;
      if (sessionId == null || cpId == null) return;
      loadCheckpointData(sessionId, cpId);
    }

    async function onFileClick(path, mode) {
      // Re-clicking the active view/diff button for the already-selected file
      // deselects it, returning to the whole-checkpoint diff — the only way
      // back once a file is chosen.
      const alreadyShowing = viewState.selectedFilePath === path && viewState.filePreviewMode === mode;
      viewState.selectedFilePath = alreadyShowing ? null : path;
      viewState.filePreviewMode = mode;
      renderWorkspacePanel();
      if (viewState.selectedFilePath === null || mode !== 'content') return;

      const sessionId = viewState.selectedSessionId;
      const cpId = viewState.selectedCpId;
      const cacheKey = `${sessionId}:${cpId}:${path}`;
      if (!viewState.fileCache.has(cacheKey)) {
        try {
          viewState.fileCache.set(cacheKey, await Api.fileContent(sessionId, cpId, path));
        } catch (e) {
          console.error('Failed to load file content:', e);
          viewState.fileCache.set(cacheKey, { kind: 'binary' });
        }
      }
      if (viewState.selectedFilePath === path) renderWorkspacePanel();
    }

    async function onDestroySessionClick(sessionId) {
      if (!confirm(`Destroy session ${sessionId}?\n\nThis permanently discards its workspace and checkpoint history — it cannot be undone.`)) {
        return;
      }
      viewState.deletingSessions.add(sessionId);
      renderSessionGrid();
      try {
        await Api.deleteSession(sessionId);
      } catch (e) {
        console.error('Failed to destroy session:', e);
        alert(`Failed to destroy session: ${e.message}`);
        viewState.deletingSessions.delete(sessionId);
        renderSessionGrid();
        return;
      }
      viewState.deletingSessions.delete(sessionId);
      if (viewState.selectedSessionId === sessionId) {
        viewState.selectedSessionId = null;
        viewState.selectedCpId = null;
        viewState.selectedFilePath = null;
        viewState.filePreviewMode = 'content';
        document.getElementById('workspace-section').classList.add('hidden');
      }
      await refresh();
    }

    let labelModalSessionId = null;

    function onEditLabelClick(sessionId) {
      labelModalSessionId = sessionId;
      document.getElementById('label-modal-input').value = findSession(sessionId)?.label || '';
      document.getElementById('label-modal-error').textContent = '';
      document.getElementById('label-modal-overlay').classList.remove('hidden');
    }

    function closeLabelModal() {
      labelModalSessionId = null;
      document.getElementById('label-modal-overlay').classList.add('hidden');
    }

    async function onSaveLabelClick() {
      const sessionId = labelModalSessionId;
      const next = document.getElementById('label-modal-input').value;
      if (!sessionId) return;

      closeLabelModal();
      try {
        await Api.setLabel(sessionId, next);
      } catch (e) {
        console.error('Failed to set label:', e);
        alert(`Failed to set label: ${e.message}`);
        return;
      }
      await refresh();
    }

    async function onSnapshotClick(sessionId, btn) {
      try {
        await Api.snapshot(sessionId);
      } catch (e) {
        console.error('Failed to snapshot session:', e);
        alert(`Failed to snapshot: ${e.message}`);
        return;
      }
      flashButton(btn);
    }

    async function onForkFromHereClick() {
      const sessionId = viewState.selectedSessionId;
      const cpId = viewState.selectedCpId;
      if (sessionId == null || cpId == null) return;
      let forked;
      try {
        forked = await Api.fork(sessionId, cpId);
      } catch (e) {
        console.error('Failed to fork session:', e);
        alert(`Failed to fork: ${e.message}`);
        return;
      }
      await refresh();
      await onSessionClick(forked.session_id);
    }

    async function onRollbackHereClick() {
      const sessionId = viewState.selectedSessionId;
      const cpId = viewState.selectedCpId;
      if (sessionId == null || cpId == null) return;
      if (!confirm(`Roll back session ${sessionId} to checkpoint ${cpId}?\n\nEvery checkpoint after this point is permanently discarded on the next write — it cannot be undone.`)) {
        return;
      }
      try {
        await Api.rollback(sessionId, cpId);
      } catch (e) {
        console.error('Failed to roll back session:', e);
        alert(`Failed to roll back: ${e.message}`);
        return;
      }
      await refresh();
    }

    // ── Refresh loop ─────────────────────────────────────────────────────────

    async function refresh() {
      try {
        const [tree, status] = await Promise.all([
          Api.sessionsTree(),
          Api.status(),
        ]);
        viewState.sessionTree = tree;
        // A busy session (its own lock held by an in-flight session_bash)
        // comes back from the server as a bare placeholder — running:true
        // but no checkpoints/label, since those aren't safely readable
        // without blocking on that lock. Reuse the last known data for it
        // instead of blanking out its card and checkpoints column for
        // however long the command runs.
        const previousById = new Map(viewState.flatSessions.map(s => [s.session_id, s]));
        viewState.flatSessions = flattenTree(tree).map(s => {
          if (!s.running || s.checkpoints.length > 0) return s;
          const previous = previousById.get(s.session_id);
          return previous ? { ...previous, running: true } : s;
        });
        viewState.daemonStatus = status;

        document.getElementById('live-dot').classList.remove('offline');
        document.getElementById('status-label').textContent = `Updated ${new Date().toLocaleTimeString()}`;

        renderStatusModal();
        renderSessionGrid();

        if (viewState.selectedSessionId && findSession(viewState.selectedSessionId)) {
          try {
            const [history, chatLog] = await Promise.all([
              Api.checkpointHistory(viewState.selectedSessionId),
              Api.chatLog(viewState.selectedSessionId),
            ]);
            viewState.checkpointHistory = history;
            viewState.chatLog = chatLog;
          } catch (_) { }
          renderCheckpointButton();
          renderCheckpointModalList();
          if (viewState.selectedCpId != null) renderWorkspacePanel();
        } else if (viewState.selectedSessionId) {
          // Selected session no longer exists (destroyed or reaped) — clear the stale detail view.
          viewState.selectedSessionId = null;
          viewState.selectedCpId = null;
          viewState.selectedFilePath = null;
          viewState.filePreviewMode = 'content';
          document.getElementById('workspace-section').classList.add('hidden');
        }
      } catch (e) {
        document.getElementById('live-dot').classList.add('offline');
        document.getElementById('status-label').textContent = 'Disconnected';
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>

</html>
