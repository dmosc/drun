<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drun setup</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d13;
      --s1: #11141d;
      --s2: #181c28;
      --border: #222638;
      --border-hi: #333a5a;
      --text: #c6cae6;
      --text-dim: #7a82aa;
      --text-muted: #444c6e;
      --accent: #7c6af5;
      --green: #4fd98a;
      --green-bg: #0b2218;
      --amber: #f0982e;
      --amber-bg: #261708;
      --mono: 'SF Mono', 'Cascadia Mono', 'Fira Code', Consolas, monospace;
      --radius: 7px;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    header {
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    header p {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.5;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .card {
      background: var(--s1);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .card-desc {
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 100px;
      white-space: nowrap;
    }

    .badge-green {
      background: var(--green-bg);
      color: var(--green);
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber);
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .cmd-row {
      margin-top: 10px;
    }

    .cmd-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .cmd-row-undo {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .cmd-row-undo .cmd-label {
      color: var(--text-muted);
    }

    .cmd-row-undo .command-line {
      opacity: 0.6;
    }

    .cmd-row-undo .command-line code {
      white-space: pre;
    }

    .btn {
      background: none;
      border: 1px solid var(--border-hi);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }

    .btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .command-line {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
    }

    .command-line code {
      flex: 1;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-dim);
      overflow-x: auto;
      white-space: nowrap;
    }

    footer {
      color: var(--text-muted);
      font-size: 11.5px;
      text-align: center;
      margin-top: 28px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h1>drun setup</h1>
    <p>
      Run the commands to install additional dependencies needed for drun.
    </p>
    <div class="header-actions">
      <button class="btn" onclick="openTerminal()">Open Terminal</button>
      <button class="btn" onclick="refreshStatus()">Validate dependencies</button>
    </div>
  </header>

  <div id="cards"></div>

  <footer>
    This wizard keeps running in the background so you can come back to this tab
    later. Close it anytime — it doesn't affect the drun daemon.
  </footer>

  <script>
    const escHtml = (s) => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));

    const Api = {
      status: () => fetch('/api/setup/status').then(r => r.json()),
      openTerminal: () => fetch('/api/setup/open-terminal', { method: 'POST' }),
    };

    // Each card's `ready` predicate is true once every one of its `steps` is
    // done. Steps show only their forward command; anything with a `reverse`
    // gets folded into one dimmed "Undo everything above" block at the
    // bottom, in reverse step order — nothing to execute or poll here, just
    // text to copy.
    const CARDS = [
      {
        id: 'daemon',
        title: 'drun daemon',
        desc: 'The main drun MCP process.',
        ready: (s) => s.daemon.running,
        links: (s) => (s.daemon.running && s.daemon.web_port)
          ? [{ label: 'Open web UI', href: `http://127.0.0.1:${s.daemon.web_port}` }]
          : [],
      },
      {
        id: 'homebrew',
        title: 'Homebrew',
        desc: 'Package manager used below to install Ollama and Tailscale.',
        visible: (s) => s.platform === 'macos',
        ready: (s) => s.homebrew.installed,
        steps: [
          { forwardLabel: 'Install Homebrew', forward: 'install_homebrew' },
        ],
      },
      {
        id: 'ollama',
        title: 'Ollama',
        desc: 'Runs local models for the standalone drun chat CLI.',
        ready: (s) => s.ollama.installed && s.ollama.running && s.ollama.model_pulled,
        steps: [
          { forwardLabel: 'Install Ollama', forward: 'install_ollama', reverse: 'uninstall_ollama' },
          { forwardLabel: 'Start the Ollama server', forward: 'start_ollama', reverse: 'stop_ollama' },
          { forwardLabel: 'Pull qwen3.6:latest', forward: 'pull_model', reverse: 'remove_model' },
        ],
      },
      {
        id: 'chat_cli',
        title: 'drun chat CLI',
        desc: "The drun CLI that forwards requests between the MCP and the model servers.",
        ready: (s) => s.chat_cli.installed,
        steps: [
          { forwardLabel: 'Install drun-sandbox[chat]', forward: 'install_chat_cli', reverse: 'uninstall_chat_cli' },
        ],
      },
      {
        id: 'tailscale',
        title: 'Tailscale (optional)',
        desc: 'Lets you manage drun session remotely.',
        ready: (s) => s.tailscale.installed && s.tailscale.daemon_running && s.tailscale.authenticated && s.tailscale.sharing,
        steps: [
          { forwardLabel: 'Install Tailscale', forward: 'install_tailscale', reverse: 'uninstall_tailscale' },
          { forwardLabel: 'Start the Tailscale daemon', forward: 'start_tailscale', reverse: 'stop_tailscale' },
          { forwardLabel: 'Sign in', forward: 'tailscale_up', reverse: 'tailscale_logout' },
          { forwardLabel: 'Share web UI', forward: 'tailscale_serve', reverse: 'tailscale_unserve' },
        ],
      },
    ];

    let latestStatus = null;

    function render() {
      if (!latestStatus) return;
      document.getElementById('cards').innerHTML = CARDS
        .filter(card => !card.visible || card.visible(latestStatus))
        .map(card => renderCard(card, latestStatus))
        .join('');
    }

    function renderCard(card, status) {
      const ready = card.ready(status);
      const links = card.links ? card.links(status) : [];
      const steps = card.steps || [];

      return `
        <div class="card">
          <div class="card-head">
            <div class="card-title">${escHtml(card.title)}</div>
            <span class="badge ${ready ? 'badge-green' : 'badge-amber'}">${ready ? 'Ready' : 'Not ready'}</span>
          </div>
          <div class="card-desc">${escHtml(card.desc)}</div>
          ${links.length ? `
            <div class="card-actions">
              ${links.map(l => `<a class="btn" href="${escHtml(l.href)}" target="_blank" rel="noopener">${escHtml(l.label)}</a>`).join('')}
            </div>
          ` : ''}
          ${steps.map(step => renderCommandRow(step.forwardLabel, status.commands[step.forward])).join('')}
          ${renderUndoRow(steps, status.commands)}
        </div>
      `;
    }

    function renderCommandRow(label, command, dim = false) {
      return `
        <div class="cmd-row${dim ? ' cmd-row-undo' : ''}">
          <div class="cmd-label">${escHtml(label)}</div>
          <div class="command-line" data-command="${escHtml(command)}">
            <code>${escHtml(command)}</code>
            <button class="btn" onclick="copyCommand(this)">Copy</button>
          </div>
        </div>
      `;
    }

    // One combined block per card, undoing every step in reverse order —
    // newline-separated (not `&&`) so a "not found" fallback comment can't
    // swallow the commands after it.
    function renderUndoRow(steps, commands) {
      const reverseCommands = steps
        .filter(step => step.reverse)
        .reverse()
        .map(step => commands[step.reverse]);
      if (!reverseCommands.length) return '';
      return renderCommandRow('Undo everything above', reverseCommands.join('\n'), true);
    }

    function copyCommand(button) {
      const command = button.closest('.command-line')?.dataset.command || '';
      navigator.clipboard?.writeText(command).catch(e => console.error('Failed to copy:', e));
    }

    function openTerminal() {
      Api.openTerminal().catch(e => console.error('Failed to open terminal:', e));
    }

    async function refreshStatus() {
      try {
        latestStatus = await Api.status();
        render();
      } catch (e) {
        console.error('Failed to load setup status:', e);
      }
    }

    refreshStatus();
  </script>
</body>

</html>
